name: Release

# Creates a GitHub release with ready-to-run executables.
# Either push a version tag:            git tag v1.2.3 && git push origin v1.2.3
# or run this workflow manually (Actions -> Release -> Run workflow) with a version number;
# the tag is then created from the selected branch. Running it for an existing tag rebuilds its assets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 (tag v1.2.3 is created if it does not exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v'" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "TAG=v$v" | Out-File -Append $env:GITHUB_ENV
          # an existing tag is rebuilt from the tagged commit
          git rev-parse -q --verify "refs/tags/v$v" | Out-Null
          if ($LASTEXITCODE -eq 0) { git checkout -q "v$v" }
          "TARGET=$(git rev-parse HEAD)" | Out-File -Append $env:GITHUB_ENV
          exit 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet run --project tests/NetworkOverview.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            # self-contained: runs without an installed .NET runtime
            dotnet publish src/NetworkOverview/NetworkOverview.csproj -c Release -r $rid --self-contained true `
              -p:Version=$env:VERSION -p:EnableCompressionInSingleFile=true -o "out/$rid-sc"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item "out/$rid-sc/NetworkOverview.exe" "dist/NetworkOverview-$env:VERSION-$rid.exe"
            # framework-dependent: small, needs the .NET 10 Desktop Runtime
            dotnet publish src/NetworkOverview/NetworkOverview.csproj -c Release -r $rid --self-contained false `
              -p:Version=$env:VERSION -o "out/$rid-fd"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item "out/$rid-fd/NetworkOverview.exe" "dist/NetworkOverview-$env:VERSION-$rid-framework-dependent.exe"
          }
          Get-ChildItem dist | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } |
            Set-Content dist/SHA256SUMS.txt

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist).FullName
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          } else {
            $flags = @('--title', "Network Overview $env:VERSION", '--generate-notes', '--target', $env:TARGET)
            if ($env:VERSION.StartsWith('0.') -or $env:VERSION.Contains('-')) { $flags += '--prerelease' }
            gh release create $env:TAG $files @flags
          }
